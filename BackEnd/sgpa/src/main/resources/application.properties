# Frontend (enlaces en correos de recuperación)
app.frontend.url=http://localhost:5173
app.password-reset.expiration-minutes=30
# Límite de códigos por correo/hora (0 = desactivado). Descomentar en producción:
app.password-reset.max-requests-per-hour=3
app.password-reset.dev-log-code=true

# SMTP Brevo — host/puerto comunes; usuario/clave/remitente en application-local.properties
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Debe ir al final para que application-local.properties no sea sobrescrito
spring.config.import=optional:classpath:application-local.properties